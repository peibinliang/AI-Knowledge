name: Push Daily Briefing to DingTalk

on:
  push:
    branches:
      - main
    paths:
      - 'daily/*.md'
  workflow_dispatch:
    inputs:
      briefing:
        description: 'Optional briefing path, e.g. daily/2026-08-17.md'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dingtalk-daily-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-dingtalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve briefing file
        id: briefing
        shell: bash
        env:
          MANUAL_BRIEFING: ${{ github.event.inputs.briefing }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_BRIEFING:-}" ]; then
            file="$MANUAL_BRIEFING"
          elif [ "${{ github.event_name }}" = "push" ]; then
            file=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              | tail -n 1 || true)
          else
            file=""
          fi

          if [ -z "$file" ]; then
            file=$(find daily -maxdepth 1 -type f -name '*.md' | sort | tail -n 1)
          fi

          if [ ! -f "$file" ]; then
            echo "Briefing file not found: $file" >&2
            exit 1
          fi

          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "Resolved briefing: $file"

      - name: Validate DingTalk secret
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "Missing repository secret: DINGTALK_WEBHOOK" >&2
            exit 1
          fi

      - name: Push briefing to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          BRIEFING_PATH: ${{ steps.briefing.outputs.path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/push_dingtalk.py
